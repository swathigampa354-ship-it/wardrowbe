name: CI

# The trial has one backend, one frontend and one image, so this is one job per
# language plus a build smoke test - no Postgres/Redis services, no coverage
# upload, no multi-arch matrix. Everything here runs in well under a minute on
# a free runner, and every command below is a command the repo owner can run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + pytest + e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-test.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Tests
        env:
          SECRET_KEY: ci-only-secret
          STORAGE_DIR: /tmp/wardrowbe-ci
        run: python -m pytest

      # Boots the app in-process against the stdlib stub provider in
      # tests/fake_provider.py: no network, no API key, no quota.
      - name: End-to-end workflow (8 steps, 62 assertions)
        env:
          SECRET_KEY: ci-only-secret
          STORAGE_DIR: /tmp/wardrowbe-ci
        run: python -m tests.e2e

  frontend:
    name: Frontend (eslint + tsc + next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # t() takes a plain string, so a key that does not exist in messages/en is
      # invisible to tsc and eslint: it renders as the raw key path, or the page
      # throws MISSING_MESSAGE. Stripping locales is exactly the kind of change
      # this catches, so it gates the build.
      - name: i18n keys resolve
        run: npm run i18n:check

      # next.config.js turns type and lint errors into build failures, and this
      # is also the only step that proves `output: 'standalone'` still emits the
      # server.js the root Dockerfile copies.
      - name: Build
        run: npm run build

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Neither shape upstream used (docker run) nor rhysd's own composite
      # action is reliable here - the latter compiles itself with Go in a
      # container and its `-ldflags` is broken under buildkit quoting. The
      # release tarball is a static binary: no container, no compile.
      - name: Install actionlint
        run: |
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint -color

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the one image the trial needs
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Without `load` the image only exists in the buildx cache and the
          # smoke test below would try to pull `wardrowbe-trial:ci` from Docker
          # Hub (403 on a private name). `load` exports it into the daemon.
          load: true
          tags: wardrowbe-trial:ci
          cache-from: type=gha,scope=trial
          cache-to: type=gha,mode=max,scope=trial

      # Fails loudly if the runtime image cannot answer. Both checks go through
      # the public port: the API is loopback-only inside the container, so
      # /api/v1/capabilities answering *through the UI proxy* proves the pair
      # and the supervisor work, which is the whole claim of this Dockerfile.
      - name: Boot the image and hit / and /api/v1/capabilities
        run: |
          docker run -d --name trial-ci -p 10000:10000 wardrowbe-trial:ci
          ui=""; api=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/ >/dev/null 2>&1; then ui=1; break; fi
            sleep 2
          done
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:10000/api/v1/capabilities >/dev/null 2>&1; then api=1; break; fi
            sleep 2
          done
          docker logs trial-ci 2>&1 | tail -40
          docker rm -f trial-ci >/dev/null 2>&1 || true
          if [ -z "$ui" ] || [ -z "$api" ]; then
            echo "container served / = ${ui:-no}, /api/v1/capabilities = ${api:-no}"
            exit 1
          fi
