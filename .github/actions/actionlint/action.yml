name: actionlint
description: Validate every workflow file in .github/workflows
runs:
  using: composite
  steps:
    - name: Run actionlint
      shell: bash
      # Same image the upstream repo pinned, so a bad `if:` or a typo in an
      # input name fails here instead of silently skipping a whole job.
      run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
